[general]
layout = "bsp"
gap = 8
auto_tile = true
focus_follows_mouse = false

[bar]
# Position of macwm-bar: top, bottom, left, or right.
position = "top"

[terminal]
# Bundle identifier of the terminal launched by the global toggle.
# Terminal.app: com.apple.Terminal
# iTerm2: com.googlecode.iterm2
# Ghostty: com.mitchellh.ghostty
# Alacritty: org.alacritty
bundle_id = "com.googlecode.iterm2"

[keys]
focus_left = "alt+h"
focus_down = "alt+j"
focus_up = "alt+k"
focus_right = "alt+l"
move_left = "alt+shift+h"
move_down = "alt+shift+j"
move_up = "alt+shift+k"
move_right = "alt+shift+l"
toggle_float = "alt+f"
maximize = "alt+m"
terminal_toggle = "grave"

# Applications toggled like the terminal, by name: bind "scratchpad chat".
# They are never tiled or hidden by workspace switches.
[scratchpads]
# chat = "net.whatsapp.WhatsApp"

# Free-form bindings: any key to any CLI command. These override [keys].
[binds]
"alt+r" = "mode resize"

# A mode is a Hyprland-style submap: only its bindings apply while active.
[binds.resize]
"h" = "resize shrink"
"l" = "resize grow"
"escape" = "mode default"

[workspaces]
count = 9

[display]
outer_gap = 8
inner_gap = 8
